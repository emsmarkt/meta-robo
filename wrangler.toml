name = "meta-robo"
main = "worker.js"
compatibility_date = "2026-01-01"

# Roda a cada 5 minutos. APPLY_MODE="live" aplica de verdade; "dry" só calcula/loga.
[triggers]
crons = ["*/5 * * * *"]

# KV: guarda cooldown, log e "regra aplicada". Crie o namespace e cole o ID abaixo.
# (Storage & Databases -> KV -> Create -> nome RULES_KV -> copie o "Namespace ID")
[[kv_namespaces]]
binding = "RULES_KV"
id = "62fa6d5180d6403f81a5485e1e77d5ea"

# Variaveis (texto). Os SECRETS (META_TOKENS e RT_TOKEN) sao adicionados
# no painel do Cloudflare (Settings -> Variaveis e segredos), NUNCA no Git.
# ALERTAS TELEGRAM (opcional): crie os DOIS no painel do Cloudflare ->
#   TG_TOKEN = token do bot (do @BotFather) — adicione como SECRET.
#   TG_CHAT  = seu chat id (do @userinfobot) — pode ser var normal.
# Sem esses dois, os alertas ficam desligados (o resto do robo roda igual).
[vars]
# APPLY_MODE aqui e so o DEFAULT inicial. O interruptor LIVE/DRY do dashboard grava a chave KV
# `applyMode`, que VENCE este valor no run() — entao o modo sobrevive a deploy (nao reverte mais).
APPLY_MODE = "dry"
RT_PTYPE = "1"
RT_ICTYPE = "2"

# ----- Parametros das REGRAS (edite aqui ou no painel do Cloudflare; tudo em texto) -----
R_DAYGOOD = "1.6"      # humor do dia: ROAS combinado >= isso = dia BOM
R_DAYOK = "1.2"        # entre R_DAYOK e R_DAYGOOD = NORMAL; abaixo = RUIM
R_MINSPEND = "100"     # (reservado)
R_FLOOR = "85"         # piso de orcamento diario (US$) — valor do CORTAR
R_CUTDAYS = "364"      # CORTAR empurra o termino p/ daqui X dias (limite FB e 365)
R_COOLDOWN = "5"       # minutos entre 2 aplicacoes na MESMA campanha (5 = reage a cada ciclo do cron)
R_PAUSECPC = "3"       # CPC (US$) acima disso...
R_PAUSESPEND = "60"    # ...E gasto acima disso, com 0 venda E 0 IC -> LIMITAR GASTO (soft-stop)
R_LIMROAS = "1.5"      # COM venda: ROAS < isso -> CORTAR (reduz orcamento). Subiu 1,4 -> 1,5 (24/07)
R_LIMMINSPEND = "1"    # SO limita por ROAS se gasto > isso (evita falso ROAS 0 na virada: venda antes do gasto)
R_REMLIMROAS = "1.5"   # robo REMOVE o limite sozinho se ROAS > isso (campanha recuperou)...
R_REMLIMSTART = "10"   # ...so entre esta hora BR...
R_REMLIMEND = "23"     # ...e esta hora BR (fora da janela 23h-3h nao remove sozinho)
R_PAUSEALERTMIN = "30" # pausada (robo OU manual) ha >= isso min E ROAS > R_REACTROAS -> AVISO Telegram p/ reativar
R_REACTROAS = "1.4"    # ROAS acima disso p/ o aviso de reativar a pausada
R_ALERTREPEAT = "30"   # repete o MESMO aviso Telegram da campanha SO a cada X min enquanto durar
R_CPATARGET = "175"    # teto de CPA = META de ROAS (175 -> 1.5)
R_CPAROPE = "190"      # teto extra em dia BOM p/ quem ja vende (2+)
R_MINROAS = "1.3"      # abaixo disso -> CORTAR (+364 dias), independente do dia. 1.3-piso -> LIMITA
# Piso de ROAS p/ "ganhar" (so no ramo de ATE 5 vendas; acima = vencedora/nao reduz):
R_ACCBASE = "1.5"        # piso padrao (<=2 vendas, ou >2 vendas em dia nao-bom)
R_ACCGOOD = "1.35"       # piso em dia BOM com >2 vendas
R_ACCGOODMINSALES = "2"  # regra do piso BOM = sales > este valor (ou seja, >2 vendas)
R_AUMMAXSALES = "5"    # campanhas com MAIS de 5 vendas: so CORTA se ROAS < R_MINROAS; >=R_EXCROAS escala; no meio MANTEM (nunca LIMITA/AUMENTA)
R_CUTNOSALE = "100"    # SEM venda: gastou >= isso -> CORTA (+364d), a QUALQUER hora, 24h/dia
# AGENDA DE ORCAMENTO (dayparting): "HH:MM=diario" separados por virgula. CBO diario muda o daily_budget;
# CBO total muda o termino p/ o diario desejado. Notifica no Telegram. 1x por slot por dia.
R_BUDSCHED = "23:30=100,03:00=50m,10:30=500"   # sufixo "m" no valor = CBO total vai p/ +364d (nao calcula do $)
R_SCHEDWIN = "12"      # janela (min) apos o horario p/ o cron de 5min pegar o slot
R_CUTDAYSMAX = "364"   # teto de dias do termino (Meta rejeita >= 1 ano)
# ALERTA Telegram (so aviso, sem acao) p/ CBO de orcamento DIARIO: ATIVA, gasto hoje >= R_DAILYSPEND,
# 0 venda, CPC > R_DAILYCPC E CPI > R_DAILYCPI. 1x por dia por campanha.
R_DAILYSPEND = "100"   # gasto de hoje minimo p/ alertar
R_DAILYCPC = "2"       # CPC (US$) acima disso = caro
R_DAILYCPI = "55"      # CPI/custo por InitiateCheckout (US$) acima disso = caro
# OPORTUNIDADE: campanha PAUSADA ou com diario < R_SCALEALERTDAILY E ROAS > R_SCALEALERTROAS -> aviso Telegram
R_SCALEALERTROAS = "1.5"
R_SCALEALERTDAILY = "300"
# RESET: nas horas R_MORNHOURS BR (lista separada por virgula, ex "0,9"), campanha de orcamento TOTAL com gasto de hoje < R_MORNMAXSPEND
# E diario atual < R_MORNMAXDAILY -> sobe o diario p/ R_MORNDAILY (via termino). 1x por dia.
R_MORNHOURS = "0,9"    # horas BR do reset (00h e 9h, todo dia) — separadas por virgula
R_MORNMAXSPEND = "120" # so se o gasto de HOJE estiver abaixo disso
R_MORNMAXDAILY = "100" # so se o ritmo diario atual estiver abaixo disso
R_MORNDAILY = "120"    # diario alvo do reset
# RESTAURAR: se a ULTIMA mudanca de termino foi um CORTAR e o ROAS voltou acima disso,
# devolve o diario que a campanha tinha ANTES do corte (dailyOld do historico).
R_RESTOREROAS = "1.5"  # cortada que recuperou p/ ROAS > isso -> devolve o diario de antes. Subiu 1,4 -> 1,5 (24/07)
R_PAUSEROAS = "1.7"    # PAUSAR (esperar rebote) enquanto ROAS < isso. Subiu 1,5 -> 1,7 (24/07). Tbm REATIVAR/AUMENTAR (>= isso)
R_ESCROAS = "1.7"      # aumenta so acima disso (com excMinSales+ vendas)
R_ESCPCT = "0.20"      # aumento = +20% do diario atual
R_PAUSESALESBREAK = "3"  # ATE N vendas pausa por R_PAUSEROAS(1,5); ACIMA de N pausa por R_MINROAS(1,3)
# SEM venda: teto por HORARIO (BR). A Meta forca travar em ~1,33x o gasto, entao gatilho = teto/1,33.
R_LIMTRIG = "90"        # SEM venda: gasto >= isso -> LIMITAR (trava ~$120 o dia inteiro; 90 x 1,33 ~= 120)
R_LIMCAP = "120"        # ...trava a campanha nesse teto de gasto (Maximo total do conjunto)
R_EXCROAS = "2.0"      # excepcional: ROAS >= isso ...
R_EXCMINSALES = "3"    # ... com pelo menos N vendas -> escalar
R_SCALEMULT = "12"     # multiplicador de escala (12x o gasto de hoje; range util 10-15)
R_AUMROASLOW = "1.5"   # faixa ROAS bom: inicio
R_AUMROASHIGH = "1.9"  # faixa ROAS bom: fim
R_AUMPCTLOW = "0.30"   # +30% no ROAS 1.5 (regra antiga de AUMENTAR — nao usada mais)
R_AUMPCTHIGH = "0.70"  # +70% no ROAS 1.9 (regra antiga de AUMENTAR — nao usada mais)
# AUMENTAR (so SUGESTAO, robo nao aplica): so apos R_AUMHOURBR h BR, ROAS de hoje >= R_PAUSEROAS(1,5)
# E ROAS dos ultimos 7 dias > R_AUMROAS7D -> sugere subir o diario p/ R_AUMMULT x o atual.
R_AUMHOURBR = "20"     # so aparece depois dessa hora BR
R_AUMROAS7D = "1.4"    # exige ROAS dos ultimos 7 dias acima disso
R_AUMMULT = "1.5"      # sugere diario = 1,5x o atual
R_AUMCAMPEADIAS = "3"  # campea (>=5 vendas): so sugere AUMENTAR se nao houve aumento nos ult. X dias
R_ROAS7DTTL = "60"     # minutos de CACHE (KV) do ROAS 7 dias — evita o 429 do RedTrack
R_SCALEUSEPCT = "0.2"  # so escala se gasto hoje >= isso do diario atual
R_RELEASE = "500"      # campanha que vende mas esta limitada -> libera p/ esse valor
R_ALERT3DROAS = "1.0"  # aviso "matar": ROAS dos 3 dias < isso
R_ALERT3DSPEND = "150" # so avisa se gastou >= isso nos 3 dias
R_FX = "5.1"           # cambio R$/US$ p/ converter o custo do RedTrack em dolar
